name: card4k
description: "Flash card app by 4aika_M."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_svg: ^2.3.0
  fl_chart: ^1.2.0
  flutter_colorpicker: ^1.1.0
  sqflite: ^2.4.3
  shared_preferences: ^2.5.5
  path: ^1.9.0
  flutter_riverpod: ^3.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/icon/settings.svg
    - assets/icon/card.svg
    - assets/icon/new card.svg
    - assets/icon/pairing.svg
    - assets/icon/selection.svg
    - assets/icon/close.svg
    - assets/icon/prev.svg
    - assets/icon/show.svg
    - assets/icon/hide.svg
    - assets/icon/next.svg
    - assets/icon/remove.svg
    - assets/icon/edit.svg

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "/Users/matvey/Documents/dev/flutter/card4k/assets/icon/icon.png"